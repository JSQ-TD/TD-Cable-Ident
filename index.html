body{margin:0;background:#F3F1EA}
.xs{display:contents}
.xh{display:none}
@media (max-width:900px){
  html{-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  header>div{padding:22px 16px 24px !important}
  header h1{font-size:34px !important}
  header p{font-size:17px !important}
  main{padding:14px 16px 48px !important;gap:16px !important}
  section{padding:18px 14px 20px !important;border-radius:14px !important}
  section h2{font-size:25px !important}
  .mc{grid-template-columns:minmax(0,1fr) !important}
  .xs{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:34px 0 12px;margin:-34px 0 -12px;scrollbar-width:thin}
  .xs.op{padding-bottom:280px;margin-bottom:-12px}
  .xh{display:block;font-family:Oswald,'Arial Narrow',sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#6B6657;margin-bottom:-6px}
  .dg{box-sizing:border-box}
  .dgl{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:6px 6px !important}
  .dgl>.gh{display:none}
  .dgl>.gl{grid-column:1/-1;margin-top:12px;padding-bottom:2px;border-bottom:1px solid #ECE9E0}
  .sel{flex:1 1 calc(50% - 12px) !important;min-width:130px;max-width:100%}
  .sel>button{width:100%;box-sizing:border-box;justify-content:space-between}
  [style*="top: calc(100% + 20px)"]{font-size:10.5px !important;letter-spacing:.03em !important}
  [style*="top: calc(100% + 17px)"]{font-size:10.5px !important;letter-spacing:.03em !important;padding:3px 6px !important}
  .dg7{min-width:920px}
  .dgk{min-width:640px}
  .dgp{min-width:560px}
  .dgw{min-width:720px}
}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
button:focus-visible{outline:3px solid #163D8A;outline-offset:2px}
